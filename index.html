<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="color-scheme" content="dark">
<meta name="cloudpc-token" content="__CLOUDPC_TOKEN__">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CloudPC</title>
<style>
:root{
  color-scheme:dark;
  --bar:#111c2d;
  --bar-text:#dbeafe;
  --accent:#78a9ff;
  --accent-ink:#081326;
  --stick:148px;
  --knob:62px;
  --action:56px;
  --hotbar:44px;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#080d16;color:#f8fafc;overscroll-behavior:none}
body{display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#toolbar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:calc(6px + env(safe-area-inset-top)) 10px 6px;background:var(--bar);color:var(--bar-text);font-size:14px;
}
#toolbar strong{font-size:15px;letter-spacing:.02em}
#status{flex:1 1 110px;min-width:0;color:#bdc9da;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fps{flex:0 0 auto;font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#93c5fd;opacity:.85}
#toolbar .buttons{display:flex;gap:6px;margin-left:auto}
button{
  min-width:48px;min-height:48px;padding:0 12px;border:0;border-radius:12px;background:#22304a;color:#e6eefc;
  font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;touch-action:manipulation;
}
button[aria-pressed="true"],button.primary{background:var(--accent);color:var(--accent-ink)}
#reconnect{display:none}
#streamBtn{min-width:0;padding:0 10px;font-size:13px;font-weight:600}
#stage{position:relative;flex:1 1 auto;min-height:0;display:flex}
#screen{position:relative;flex:1 1 auto;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
#screen canvas{max-width:100%;max-height:100%;touch-action:none}
/* The GPU stage covers noVNC's canvas and is purely visual: it takes no pointer
 * events, so taps fall through to the canvas underneath and noVNC still sends
 * them. It also has to escape the max-width/max-height rule above, because its
 * size is set explicitly from the rect of the canvas it is covering. */
#screen canvas.gpuStage{
  position:absolute;pointer-events:none;max-width:none;max-height:none;background:#000;
}

/* ---------- trackpad overlay (whole desktop) ---------- */
#trackpad{
  position:absolute;inset:0;z-index:25;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;
  padding:10px calc(10px + env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
  touch-action:none;
}
#trackpad[hidden]{display:none}
#trackpad .hint{
  align-self:center;margin:0;padding:6px 12px;border-radius:999px;font-size:11.5px;line-height:1.4;text-align:center;
  color:#d7e4ff;background:rgba(8,13,22,.66);backdrop-filter:blur(6px);pointer-events:none;
}
#trackpad .strip{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#trackpad .strip button{
  min-width:0;min-height:44px;padding:0 12px;border-radius:12px;font-size:12.5px;
  background:rgba(34,48,74,.82);backdrop-filter:blur(6px);
}
#trackpad .clicks{display:flex;gap:10px;justify-content:space-between}
#trackpad .clicks button{
  flex:1 1 0;min-height:60px;border-radius:18px;font-size:15px;
  background:rgba(34,48,74,.82);backdrop-filter:blur(6px);
}

/* ---------- game overlay: joystick left, look and actions right ---------- */
#controls{position:absolute;inset:0;z-index:25;pointer-events:none}
#controls[hidden]{display:none}

/* Movement: the whole left half is the stick zone, the ring appears where the
 * thumb lands so it never has to be aimed at a fixed corner. */
#stickZone{position:absolute;inset:0 54% calc(var(--hotbar) + 26px) 0;pointer-events:auto;touch-action:none}
#stick{
  position:absolute;left:calc(16px + env(safe-area-inset-left));bottom:calc(16px + env(safe-area-inset-bottom));
  width:var(--stick);height:var(--stick);border-radius:50%;opacity:.8;
  border:2px solid rgba(120,169,255,.35);background:rgba(34,48,74,.28);
  display:flex;align-items:center;justify-content:center;
}
#stick[data-active="1"]{opacity:1;background:rgba(34,48,74,.55)}
#stick .knob{
  width:var(--knob);height:var(--knob);border-radius:50%;background:rgba(120,169,255,.6);
  border:2px solid rgba(207,224,255,.6);box-shadow:0 4px 14px rgba(0,0,0,.45);
}

/* Look: dragging anywhere in the right half turns the camera. The cursor is not
 * drawn there, because the camera reads relative movement, not a pointer. */
#lookside{
  position:absolute;inset:0 0 0 54%;pointer-events:auto;touch-action:none;cursor:none;
  display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:8px;
  padding:8px calc(14px + env(safe-area-inset-right)) calc(var(--hotbar) + 30px + env(safe-area-inset-bottom)) 10px;
}
#lookside .lookspeed{
  display:flex;align-items:center;gap:8px;max-width:100%;margin:0;padding:2px 10px;border-radius:999px;
  font-size:11px;color:#cfe0ff;white-space:nowrap;background:rgba(8,13,22,.5);
  pointer-events:auto;touch-action:manipulation;
}
#lookside .lookspeed input{flex:1 1 auto;width:110px;min-width:0;height:26px;margin:0;accent-color:var(--accent)}
#lookside .actgrid{display:grid;grid-template-columns:repeat(3,var(--action));gap:8px;pointer-events:none}
#lookside .actgrid button{
  width:var(--action);height:var(--action);min-width:0;min-height:0;padding:0;border-radius:16px;
  background:rgba(34,48,74,.6);font-size:12px;line-height:1.1;letter-spacing:.01em;
  pointer-events:auto;touch-action:none;backdrop-filter:blur(6px);
}
#lookside .actgrid button[data-mouse]{font-size:12.5px;font-weight:700}

/* Hotbar: the nine slots along the bottom, where Minecraft's own bar sits. It is a
 * strip of its own rather than part of the look half, so reaching for a slot never
 * turns the camera, and the look half's buttons are padded to sit above it. */
#hotbar{
  position:absolute;z-index:26;display:flex;justify-content:center;gap:6px;
  left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));
  bottom:calc(8px + env(safe-area-inset-bottom));pointer-events:none;
}
#hotbar button{
  flex:0 1 var(--hotbar);width:var(--hotbar);min-width:0;height:var(--hotbar);padding:0;
  border-radius:12px;background:rgba(34,48,74,.62);font-size:13px;font-weight:700;
  pointer-events:auto;touch-action:none;backdrop-filter:blur(6px);
}
#controls button[data-active="1"],#trackpad button[data-active="1"]{background:var(--accent);color:var(--accent-ink)}

/* What the look path is actually doing: the travel just sent and where the desktop
 * pointer ended up. Small, read-only, and only while the game overlay is on. */
#lookDebug{
  position:absolute;left:calc(8px + env(safe-area-inset-left));top:8px;z-index:27;
  max-width:calc(100% - 16px);padding:4px 8px;border-radius:8px;
  font:11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:#cfe0ff;
  background:rgba(8,13,22,.62);white-space:pre-wrap;pointer-events:none;
}
#lookDebug[hidden]{display:none}

/* ---------- password prompt ---------- */
#passwordPrompt{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(8,13,22,.84)}
#passwordPrompt[hidden]{display:none}
#passwordPrompt form{width:min(380px,100%);display:grid;gap:12px;padding:20px;border-radius:18px;background:#111c2d;box-shadow:0 20px 44px rgba(0,0,0,.5)}
#passwordPrompt h1{margin:0;font-size:17px}
#passwordPrompt p{margin:0;color:#bdc9da;font-size:13px;line-height:1.45}
#passwordPrompt input{min-height:48px;padding:0 12px;border-radius:12px;border:1px solid #2c3d5a;background:#0b1420;color:#f8fafc;font:inherit}
#passwordPrompt .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#vk{position:fixed;left:0;bottom:0;width:1px;height:1px;padding:0;border:0;opacity:0}
@media (max-width:480px){
  :root{--stick:126px;--knob:54px;--action:50px;--hotbar:38px}
  #hotbar{gap:4px}
  #toolbar{font-size:13px}
  #toolbar strong{display:none}
  #trackpad .hint{font-size:11px}
  #trackpad .strip button{font-size:12px;padding:0 10px}
  #lookside .actgrid{gap:6px}
  #lookside .actgrid button{font-size:11px}
}
</style>
</head>
<body>
<header id="toolbar">
  <strong>CloudPC</strong>
  <span id="status">Connecting to desktop…</span>
  <span id="fps" title="The game's frames per second while it runs, capped by the updates the stream delivers. A still picture sends no updates, which is not a slow game.">idle</span>
  <div class="buttons">
    <button id="keyboardBtn" type="button" title="On-screen keyboard" aria-label="On-screen keyboard">⌨</button>
    <button id="trackpadBtn" type="button" title="Trackpad (touch pointer)" aria-label="Trackpad" aria-pressed="false">🖱</button>
    <button id="controlsBtn" type="button" title="Game controls" aria-label="Game controls" aria-pressed="false">🎮</button>
    <button id="fullscreenBtn" type="button" title="Fullscreen" aria-label="Fullscreen">⛶</button>
    <button id="detailBtn" type="button" title="Picture detail">Auto</button>
    <button id="streamBtn" type="button" title="Stream quality">Fast</button>
    <button id="upscaleBtn" type="button" title="GPU upscale (WebGPU)" aria-pressed="true">GPU off</button>
    <button id="reconnect" class="primary" type="button">Reconnect</button>

  </div>
</header>

<div id="stage">
  <div id="screen"></div>

  <div id="trackpad" hidden>
    <p class="hint">Drag to move the cursor · tap = click · hold = drag · two-finger tap = right click · two-finger drag = scroll</p>
    <div class="strip">
      <button type="button" data-scroll="-60">▲ Scroll up</button>
      <button type="button" data-scroll="60">▼ Scroll down</button>
      <button type="button" data-combo="alt-tab">Alt+Tab</button>
      <button type="button" data-combo="alt-f4">Alt+F4</button>
      <button type="button" data-key="Super_L">Menu</button>
    </div>
    <div class="clicks">
      <button type="button" data-mouse="1">Left click</button>
      <button type="button" data-mouse="2">Right click</button>
    </div>
  </div>

  <div id="controls" hidden>
    <div id="stickZone">
      <div id="stick" data-active="0"><div class="knob" id="knob"></div></div>
    </div>
    <div id="lookside">
      <label class="lookspeed">Look speed<input id="lookSpeed" type="range" min="0.1" max="1.6" step="0.05" value="0.45" aria-label="Look speed"></label>
      <div class="actgrid">
        <button type="button" data-key="KeyQ">Drop</button>
        <button type="button" data-key="KeyT">Chat</button>
        <button type="button" data-key="Escape">Esc</button>
        <button type="button" data-key="ShiftLeft">Sneak</button>
        <button type="button" data-key="ControlLeft">Sprint</button>
        <button type="button" data-key="KeyE">Inv</button>
        <button type="button" data-mouse="1">LMB</button>
        <button type="button" data-mouse="2">RMB</button>
        <button type="button" data-key="Space">Jump</button>
      </div>
    </div>
    <div id="lookDebug" hidden></div>
    <div id="hotbar" role="group" aria-label="Hotbar">
      <button type="button" data-key="Digit1">1</button>
      <button type="button" data-key="Digit2">2</button>
      <button type="button" data-key="Digit3">3</button>
      <button type="button" data-key="Digit4">4</button>
      <button type="button" data-key="Digit5">5</button>
      <button type="button" data-key="Digit6">6</button>
      <button type="button" data-key="Digit7">7</button>
      <button type="button" data-key="Digit8">8</button>
      <button type="button" data-key="Digit9">9</button>
    </div>
  </div>
</div>

<div id="passwordPrompt" hidden>
  <form id="passwordForm">
    <h1>VNC password</h1>
    <p id="passwordMessage">This desktop is protected by a password.</p>
    <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Password" aria-label="VNC password">
    <div class="row">
      <button id="passwordCancel" type="button">Cancel</button>
      <button class="primary" type="submit">Connect</button>
    </div>
  </form>
</div>

<textarea id="vk" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" aria-hidden="true" tabindex="-1"></textarea>

<script type="module">
import RFB from "/core/rfb.js";

const screenEl = document.querySelector("#screen");
const statusEl = document.querySelector("#status");
const fpsEl = document.querySelector("#fps");
const reconnectBtn = document.querySelector("#reconnect");
const keyboardBtn = document.querySelector("#keyboardBtn");
const trackpadBtn = document.querySelector("#trackpadBtn");
const controlsBtn = document.querySelector("#controlsBtn");
const fullscreenBtn = document.querySelector("#fullscreenBtn");
const streamBtn = document.querySelector("#streamBtn");
const detailBtn = document.querySelector("#detailBtn");
const upscaleBtn = document.querySelector("#upscaleBtn");
const trackpadEl = document.querySelector("#trackpad");
const controlsEl = document.querySelector("#controls");
const lookSurface = document.querySelector("#lookside");
const lookDebugEl = document.querySelector("#lookDebug");
const vk = document.querySelector("#vk");
const passwordPrompt = document.querySelector("#passwordPrompt");
const passwordForm = document.querySelector("#passwordForm");
const passwordInput = document.querySelector("#passwordInput");
const passwordMessage = document.querySelector("#passwordMessage");
const passwordCancel = document.querySelector("#passwordCancel");

let rfb = null;
let canvas = null;
let cursor = null;
let mode = "none";

/* ---------- keysyms ---------- */
const CODE_KEYSYMS = {
  Space: 0x0020, Escape: 0xff1b, Enter: 0xff0d, NumpadEnter: 0xff0d, Tab: 0xff09,
  Backspace: 0xff08, Delete: 0xffff,
  ArrowLeft: 0xff51, ArrowUp: 0xff52, ArrowRight: 0xff53, ArrowDown: 0xff54,
  ShiftLeft: 0xffe1, ShiftRight: 0xffe2, ControlLeft: 0xffe3, ControlRight: 0xffe4,
  AltLeft: 0xffe9, AltRight: 0xffea, MetaLeft: 0xffeb, MetaRight: 0xffec,
  Super_L: 0xffeb,
  Home: 0xff50, End: 0xff57, PageUp: 0xff55, PageDown: 0xff56,
  F1: 0xffbe, F2: 0xffbf, F3: 0xffc0, F4: 0xffc1, F5: 0xffc2, F6: 0xffc3,
};

const COMBOS = {
  "alt-tab": [[0xffe9, "AltLeft"], [0xff09, "Tab"]],
  "alt-f4": [[0xffe9, "AltLeft"], [0xffc1, "F4"]],
};

function charKeysym(ch) {
  const cp = ch.codePointAt(0);
  if (cp >= 0x20 && cp <= 0x7e) return cp;
  return 0x01000000 | cp;
}

function keysymForCode(code) {
  if (CODE_KEYSYMS[code] !== undefined) return CODE_KEYSYMS[code];
  if (code.startsWith("Key")) return code.charCodeAt(3) + 0x20;
  if (code.startsWith("Digit")) return code.charCodeAt(5);
  return 0;
}

function keyDown(keysym, code) { if (rfb) rfb.sendKey(keysym, code || null, true); }
function keyUp(keysym, code) { if (rfb) rfb.sendKey(keysym, code || null, false); }
function tapKey(keysym, code) { if (rfb) rfb.sendKey(keysym, code || null); }

function sendCombo(keysyms) {
  for (const [keysym, code] of keysyms) keyDown(keysym, code);
  for (const [keysym, code] of [...keysyms].reverse()) keyUp(keysym, code);
}

/* ---------- on-screen keyboard ---------- */
keyboardBtn.addEventListener("click", () => {
  if (document.activeElement === vk) {
    vk.blur();
  } else {
    vk.value = "";
    vk.focus();
  }
});

vk.addEventListener("keydown", event => {
  const keysym = CODE_KEYSYMS[event.code];
  if (keysym === undefined) return; /* printable characters arrive via `input` */
  event.preventDefault();
  tapKey(keysym, event.code);
});

vk.addEventListener("input", () => {
  const text = vk.value;
  vk.value = "";
  for (const ch of text) tapKey(charKeysym(ch), null);
});

/* ---------- fullscreen ---------- */
fullscreenBtn.addEventListener("click", async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch {
    /* browsers without fullscreen support simply ignore this */
  }
});

/* ---------- pointer plumbing (noVNC maps canvas mouse events itself) ---------- */
function canvasRect() { return canvas ? canvas.getBoundingClientRect() : null; }

function clampToCanvas(x, y) {
  const rect = canvasRect();
  if (!rect || rect.width === 0 || rect.height === 0) return { x, y };
  return {
    x: Math.min(Math.max(x, rect.left + 1), rect.right - 1),
    y: Math.min(Math.max(y, rect.top + 1), rect.bottom - 1),
  };
}

function dispatchMouse(type, x, y, buttons, button) {
  if (!canvas) return;
  canvas.dispatchEvent(new MouseEvent(type, {
    clientX: x, clientY: y, buttons, button: button || 0,
    bubbles: true, cancelable: true, view: window,
  }));
}

function ensureCursor() {
  const rect = canvasRect();
  if (cursor && rect) {
    cursor = clampToCanvas(cursor.x, cursor.y);
    return cursor;
  }
  if (!rect) return null;
  cursor = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
  return cursor;
}

/* Where a button press is aimed.
 *
 * Look itself no longer needs a point on the desktop: it sends relative travel (see
 * the look section further down), so there is no centre to get wrong and no clamping
 * to lose the direction of a drag. A press is different — a button down is only ever
 * an absolute RFB event — so in the game overlay it goes to the middle of the
 * streamed canvas, clamped inside it. The container fits the game window to the
 * screen, so that point is inside the game; with a menu open it is the middle of the
 * menu. On the trackpad it stays the trackpad's own cursor.
 *
 * A windowed game keeps working: while the pointer is grabbed, Minecraft only cares
 * that a button went down, not where, and the window is still fitted to the screen
 * for the stream's sake (fit_game_window in entrypoint.sh). */
function clickPoint() {
  const rect = canvasRect();
  if (!rect) return null;
  return clampToCanvas(rect.left + rect.width / 2, rect.top + rect.height / 2);
}

function gamePoint() { return mode === "game" ? clickPoint() : ensureCursor(); }

/* Every pointer event costs the desktop an XTest motion that x11vnc then has to
 * process, and the desktop CPU is the scarce resource here. The remote server
 * only ever sees the pointer position it reads next, so all the movements inside
 * one animation frame can be collapsed into a single event. */
let moveFrame = 0;
let pendingMove = null;

function flushMove() {
  moveFrame = 0;
  const next = pendingMove;
  pendingMove = null;
  if (!next || !canvas) return;
  dispatchMouse("mousemove", next.x, next.y, 0, 0);
}

function cancelMove() {
  if (moveFrame) cancelAnimationFrame(moveFrame);
  moveFrame = 0;
  pendingMove = null;
}

function queueMove(x, y) {
  pendingMove = { x, y };
  if (!moveFrame) moveFrame = requestAnimationFrame(flushMove);
}

function moveCursorBy(dx, dy) {
  const position = ensureCursor();
  if (!position) return;
  const next = clampToCanvas(position.x + dx, position.y + dy);
  cursor = next;
  queueMove(next.x, next.y);
}

function clickMouse(button) {
  const position = gamePoint();
  if (!position) return;
  /* a queued move would land after the click and drag the cursor away */
  cancelMove();
  const mask = button === 2 ? 2 : button === 3 ? 4 : 1;
  dispatchMouse("mousemove", position.x, position.y, 0, button || 0);
  dispatchMouse("mousedown", position.x, position.y, mask, button || 0);
  dispatchMouse("mouseup", position.x, position.y, 0, button || 0);
}

/* Minecraft needs a button that stays down to mine a block or place a stack, so
 * the overlay's LMB/RMB are held for as long as a finger is on them. */
function pressMouse(button) {
  const position = gamePoint();
  if (!position) return;
  cancelMove();
  const mask = button === 2 ? 2 : button === 3 ? 4 : 1;
  dispatchMouse("mousemove", position.x, position.y, 0, button || 0);
  dispatchMouse("mousedown", position.x, position.y, mask, button || 0);
}

function releaseMouse(button) {
  const position = gamePoint();
  if (!position) return;
  dispatchMouse("mouseup", position.x, position.y, 0, button || 0);
}

function scrollAtCursor(deltaY) {
  const position = gamePoint();
  if (!position || !canvas) return;
  canvas.dispatchEvent(new WheelEvent("wheel", {
    clientX: position.x, clientY: position.y, deltaY, deltaMode: 0, buttons: 0,
    bubbles: true, cancelable: true,
  }));
}

window.addEventListener("resize", () => {
  if (cursor) cursor = clampToCanvas(cursor.x, cursor.y);
});

/* ---------- trackpad overlay ---------- */
const TAP_SLOP = 14;
const TAP_TIME = 500;
const HOLD_DELAY = 420;
const SCROLL_DRAG_STEP = 20;

const track = {
  pointers: new Map(),
  gesture: null,
  lastX: 0,
  lastY: 0,
  moved: 0,
  start: 0,
  wheel: 0,
  dragging: false,
  multi: false,
  holdTimer: null,
};

function trackReset() {
  clearTimeout(track.holdTimer);
  track.holdTimer = null;
  if (track.dragging) {
    const position = ensureCursor();
    if (position) dispatchMouse("mouseup", position.x, position.y, 0, 0);
  }
  track.pointers.clear();
  track.gesture = null;
  track.dragging = false;
  track.multi = false;
  track.wheel = 0;
  track.moved = 0;
}

function trackDown(event) {
  if (event.target.closest("button")) return;
  event.preventDefault();
  if (trackpadEl.setPointerCapture) trackpadEl.setPointerCapture(event.pointerId);
  track.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

  if (track.pointers.size === 1) {
    track.gesture = "single";
    track.lastX = event.clientX;
    track.lastY = event.clientY;
    track.moved = 0;
    track.multi = false;
    track.start = Date.now();
    track.wheel = 0;
    track.dragging = false;
    ensureCursor();
    track.holdTimer = setTimeout(() => {
      if (track.moved > TAP_SLOP || track.dragging) return;
      const position = ensureCursor();
      if (!position) return;
      track.dragging = true;
      dispatchMouse("mousedown", position.x, position.y, 1, 0);
      trackpadEl.dataset.drag = "1";
    }, HOLD_DELAY);
  } else if (track.pointers.size === 2) {
    clearTimeout(track.holdTimer);
    track.holdTimer = null;
    if (track.dragging) {
      const position = ensureCursor();
      if (position) dispatchMouse("mouseup", position.x, position.y, 0, 0);
      track.dragging = false;
      delete trackpadEl.dataset.drag;
    }
    track.gesture = "multi";
    track.multi = true;
    const points = [...track.pointers.values()];
    track.lastX = (points[0].x + points[1].x) / 2;
    track.lastY = (points[0].y + points[1].y) / 2;
    track.moved = 0;
    track.start = Date.now();
    track.wheel = 0;
  }
}

function trackMove(event) {
  if (!track.pointers.has(event.pointerId)) return;
  event.preventDefault();
  track.pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

  if (track.gesture === "single" && track.pointers.size === 1) {
    const point = track.pointers.get(event.pointerId);
    const dx = point.x - track.lastX;
    const dy = point.y - track.lastY;
    if (dx === 0 && dy === 0) return;
    track.lastX = point.x;
    track.lastY = point.y;
    const distance = Math.abs(dx) + Math.abs(dy);
    track.moved += distance;
    const gain = distance > 40 ? 2.6 : distance > 14 ? 1.9 : 1.25;
    moveCursorBy(dx * gain, dy * gain);
  } else if (track.gesture === "multi" && track.pointers.size >= 2) {
    const points = [...track.pointers.values()];
    const cx = points.reduce((sum, point) => sum + point.x, 0) / points.length;
    const cy = points.reduce((sum, point) => sum + point.y, 0) / points.length;
    const dx = cx - track.lastX;
    const dy = cy - track.lastY;
    track.lastX = cx;
    track.lastY = cy;
    track.moved += Math.abs(dx) + Math.abs(dy);
    track.wheel += dy;
    while (Math.abs(track.wheel) >= SCROLL_DRAG_STEP) {
      const step = track.wheel > 0 ? 60 : -60;
      scrollAtCursor(step);
      /* noVNC only sends a wheel step per 50 accumulated pixels */
      track.wheel -= track.wheel > 0 ? SCROLL_DRAG_STEP : -SCROLL_DRAG_STEP;
    }
  }
}

function trackUp(event, cancelled) {
  if (!track.pointers.has(event.pointerId)) return;
  track.pointers.delete(event.pointerId);
  clearTimeout(track.holdTimer);
  track.holdTimer = null;

  if (track.pointers.size === 1) {
    const [rest] = [...track.pointers.values()];
    track.gesture = "single";
    track.lastX = rest.x;
    track.lastY = rest.y;
    return;
  }
  if (track.pointers.size > 0) return;

  const multi = track.multi;
  const elapsed = Date.now() - track.start;
  track.gesture = null;

  if (track.dragging) {
    const position = ensureCursor();
    if (position) dispatchMouse("mouseup", position.x, position.y, 0, 0);
    track.dragging = false;
    delete trackpadEl.dataset.drag;
    return;
  }
  if (cancelled) return;
  if (track.moved > TAP_SLOP || elapsed > TAP_TIME) return;

  clickMouse(multi ? 2 : 0);
}

trackpadEl.addEventListener("pointerdown", trackDown);
trackpadEl.addEventListener("pointermove", trackMove);
trackpadEl.addEventListener("pointerup", event => trackUp(event, false));
trackpadEl.addEventListener("pointercancel", event => trackUp(event, true));

for (const button of trackpadEl.querySelectorAll("button[data-mouse]")) {
  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    clickMouse(Number(button.dataset.mouse));
  });
}
for (const button of trackpadEl.querySelectorAll("button[data-scroll]")) {
  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    scrollAtCursor(Number(button.dataset.scroll));
  });
}
for (const button of trackpadEl.querySelectorAll("button[data-combo]")) {
  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    const combo = COMBOS[button.dataset.combo];
    if (combo) sendCombo(combo);
  });
}
for (const button of trackpadEl.querySelectorAll("button[data-key]")) {
  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    tapKey(keysymForCode(button.dataset.key), button.dataset.key);
  });
}

/* ---------- game overlay ---------- */
controlsBtn.addEventListener("click", () => setMode("game"));
trackpadBtn.addEventListener("click", () => setMode("trackpad"));

function setMode(next) {
  mode = mode === next ? "none" : next;
  trackpadEl.hidden = mode !== "trackpad";
  controlsEl.hidden = mode !== "game";
  trackpadBtn.setAttribute("aria-pressed", String(mode === "trackpad"));
  controlsBtn.setAttribute("aria-pressed", String(mode === "game"));
  if (mode === "trackpad") ensureCursor();
  if (mode !== "trackpad") trackReset();
  if (mode !== "game") gameReset();
  lookDebugEl.hidden = mode !== "game";
  if (mode === "game") showLookDebug();
  syncLock();
}

/* No remote cursor dot while the overlay owns the pointer: the overlay is turning the
 * camera, not pointing at things, and the game hides the cursor anyway. */
function syncLock() {
  if (rfb) {
    try { rfb.showDotCursor = mode !== "game"; } catch { /* older noVNC */ }
  }
}

for (const button of controlsEl.querySelectorAll("button[data-key]")) {
  const code = button.dataset.key;
  const keysym = keysymForCode(code);

  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    if (button.setPointerCapture) button.setPointerCapture(event.pointerId);
    button.dataset.active = "1";
    keyDown(keysym, code);
  });

  const release = () => {
    if (button.dataset.active !== "1") return;
    delete button.dataset.active;
    keyUp(keysym, code);
  };
  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
  button.addEventListener("lostpointercapture", release);
}

/* Look speed is measured in screen pixels per CSS pixel of travel, so it means the
 * same on a phone and on a desktop browser no matter how far the desktop is scaled
 * down in the browser. 1.0 follows the finger exactly; the default is slower on purpose
 * because Minecraft applies its own mouse sensitivity on top. */
const lookSpeed = document.querySelector("#lookSpeed");
const LOOK_SPEED_KEY = "cloudpc.lookSpeed";
let lookGain = 0.45;
try {
  const stored = Number(localStorage.getItem(LOOK_SPEED_KEY));
  if (Number.isFinite(stored) && stored >= 0.1 && stored <= 1.6) lookGain = stored;
} catch {
  /* storage can be blocked; the default stands */
}
lookSpeed.value = String(lookGain);
lookSpeed.addEventListener("input", () => {
  const value = Number(lookSpeed.value);
  if (!Number.isFinite(value)) return;
  lookGain = value;
  try { localStorage.setItem(LOOK_SPEED_KEY, String(value)); } catch { /* ignore */ }
});

function remotePixelsPerCssPixel() {
  if (!canvas || !canvas.clientWidth) return 1;
  return canvas.width / canvas.clientWidth || 1;
}

/* ---------- look: real relative motion, injected on the desktop ----------
 *
 * RFB carries absolute pointer positions only, so a look update used to be "a point
 * on the desktop". Minecraft does not read a pointer, though: it reads the mouse as
 * the distance from the centre of its own window, where it pins the hidden cursor
 * while you play. Any point that is not exactly that centre leaves a constant
 * difference which every single update adds, so the camera walks one way whatever
 * the finger does, and dragging back only subtracts a little from the walk. noVNC
 * adds to it by clamping points outside the canvas to its last pixel, which throws
 * the sign of the drag away as well.
 *
 * So look no longer sends a position at all. The travel goes to /cloudpc/mouse and
 * the container moves the X pointer by exactly that much as relative motion (XTEST;
 * see mouseproxy.py): the game reads the delta and nothing else, so a drag left is
 * the exact opposite of a drag right and the camera comes back. Where the window is,
 * whether it is fullscreen and how the stream is scaled no longer matter, and the
 * trackpad below still drives the cursor absolutely as before.
 *
 * Minecraft reads the mouse 20 times a second no matter what the frame rate is,
 * so movement is collected and sent at that rate: the same turning speed at 5 or
 * 60 fps, one small request per tick instead of dozens, and nothing lost, because
 * travel that has not been sent yet stays queued. */
const LOOK_INTERVAL = 50;
const LOOK_URL = "/cloudpc/mouse";

/* The control endpoints take the token this page was served with, and they are plain
 * GETs. Both are deliberate. They used to be POSTs with a JSON body and an X-CloudPC
 * header, and in front of a gateway that is two ways to fail: the proxy can refuse a
 * method it does not route (501) and it can rewrite the Host header, which the
 * container compared against Origin and answered 403. A GET with no custom header is
 * the same kind of request as every file of this page, so the proxy carries it; the
 * token is what keeps it ours, because a page on another origin cannot read it. */
const tokenTag = document.querySelector('meta[name="cloudpc-token"]');
const CONTROL_TOKEN = (() => {
  const value = tokenTag ? tokenTag.getAttribute("content") || "" : "";
  return value.startsWith("__") ? "" : value;
})();
function controlUrl(path, params) {
  const query = new URLSearchParams(params || {});
  if (CONTROL_TOKEN) query.set("t", CONTROL_TOKEN);
  return path + "?" + query.toString();
}
/* Two steps may be out at once, not one. A step only needs its reply for the debug
 * readout, but waiting for it before sending the next one made the round trip part
 * of the cadence: on a 90 ms link the camera updated every 140 ms whatever the timer
 * said, and the newest travel sat behind a reply nobody was waiting for. Two in
 * flight keeps the cadence at the timer's 50 ms while still bounding how far the
 * camera can run ahead of the finger. */
const LOOK_IN_FLIGHT_MAX = 2;
let look = null;
let lookTimer = 0;
let lookInFlight = 0;
let lookSentAt = 0;
let lookOk = 0;
let lookFail = 0;
let lookStep = { x: 0, y: 0 };
let lookPointer = "";
let lookNote = "";
const lookTravel = { x: 0, y: 0 };

function showLookDebug() {
  if (lookDebugEl.hidden) return;
  lookDebugEl.textContent =
    "look " + lookStep.x + "," + lookStep.y +
    "  pointer " + (lookPointer || "?") +
    "\nsent " + lookOk + "  failed " + lookFail +
    (lookNote ? "  " + lookNote : "");
}

/* One request per tick. The pointer position the desktop reports back is what tells
 * a broken look apart from a broken game: if it moves the way the finger went, the
 * injection works and the problem is above it; if it never moves, it is this side. */
function sendLook(dx, dy) {
  const gain = lookGain * remotePixelsPerCssPixel();
  const stepX = Math.round(dx * gain);
  const stepY = Math.round(dy * gain);
  if (!stepX && !stepY) return;
  lookStep = { x: stepX, y: stepY };
  lookInFlight += 1;
  /* One request that never settles used to leave lookInFlight set for the life of the
   * page: one lost reply and the camera was dead until a reload, which is exactly how
   * this failed before. The travel stays queued, so a timeout costs nothing. */
  const stop = new AbortController();
  const deadline = setTimeout(() => stop.abort(), 900);
  fetch(controlUrl(LOOK_URL, { dx: stepX, dy: stepY }), {
    cache: "no-store",
    signal: stop.signal,
  })
    .then(response => response.json()
      .catch(() => ({}))
      .then(data => ({ response, data })))
    .then(({ response, data }) => {
      if (!response.ok || data.ok === false) {
        lookFail += 1;
        lookNote = (response.ok ? "" : "http " + response.status) +
          (data && data.error ? " " + data.error : "");
        return;
      }
      lookOk += 1;
      lookNote = "";
      if (Number.isFinite(data.x)) lookPointer = data.x + "," + data.y;
    })
    .catch(() => { lookFail += 1; lookNote = "no reply"; })
    .finally(() => {
      clearTimeout(deadline);
      lookInFlight = Math.max(0, lookInFlight - 1);
      /* Whatever travel arrived while this request was out has been collecting in
       * lookTravel. Send it as one bigger step rather than queueing a request
       * behind this one: on a slow link a queue grows every second and the view
       * ends up a second behind the finger. The cap on steps in flight bounds the
       * lag at a fixed two round trips, and no motion is lost, because the deltas
       * add up. */
      if (lookTravel.x || lookTravel.y) queueLook();
      showLookDebug();
    });
}

function flushLook() {
  if (lookTimer) { clearTimeout(lookTimer); lookTimer = 0; }
  if (lookInFlight >= LOOK_IN_FLIGHT_MAX) return;
  const dx = lookTravel.x;
  const dy = lookTravel.y;
  if (!dx && !dy) return;
  lookTravel.x = 0;
  lookTravel.y = 0;
  lookSentAt = performance.now();
  sendLook(dx, dy);
}

function queueLook() {
  if (lookTimer || lookInFlight >= LOOK_IN_FLIGHT_MAX) return;
  const wait = LOOK_INTERVAL - (performance.now() - lookSentAt);
  if (wait <= 0) {
    flushLook();
    return;
  }
  lookTimer = setTimeout(() => { lookTimer = 0; flushLook(); }, wait);
}

/* The whole right half turns the camera: no pad to aim at, and no click, so a tap
 * (or the end of a drag) never fires a stray attack. Buttons and the slider keep
 * their own touches. */
lookSurface.addEventListener("pointerdown", event => {
  if (event.target.closest("button, input, label")) return;
  event.preventDefault();
  if (lookSurface.setPointerCapture) lookSurface.setPointerCapture(event.pointerId);
  look = { id: event.pointerId, x: event.clientX, y: event.clientY };
});

/* Pointer capture is not dependable in every iPad browser, so the move and
 * release handlers live on the window and follow only the pointer that started
 * the gesture. Otherwise a drag that slides off the surface stops turning. */
window.addEventListener("pointermove", event => {
  if (!look || event.pointerId !== look.id) return;
  event.preventDefault();
  lookTravel.x += event.clientX - look.x;
  lookTravel.y += event.clientY - look.y;
  look.x = event.clientX;
  look.y = event.clientY;
  queueLook();
}, { passive: false });

function endLook(event) {
  if (!look || event.pointerId !== look.id) return;
  look = null;
  flushLook(); /* send the tail of the drag straight away */
}
window.addEventListener("pointerup", endLook);
window.addEventListener("pointercancel", endLook);

/* ---------- movement joystick ----------
 * The left half is a floating stick: the ring appears under the thumb and drives
 * W/A/S/D, diagonals included, so eight directions come from one control instead
 * of four buttons. Releasing lets go of every key it pressed. */
const stickZone = document.querySelector("#stickZone");
const stickEl = document.querySelector("#stick");
const stickKnob = document.querySelector("#knob");
const stickHeld = new Set();
let stickPointer = null;
let stickOrigin = { x: 0, y: 0 };
let stickRadius = 64;

function stickMove(dx, dy) {
  const distance = Math.hypot(dx, dy);
  if (distance > stickRadius) {
    dx = dx / distance * stickRadius;
    dy = dy / distance * stickRadius;
  }
  stickKnob.style.transform = `translate(${dx}px, ${dy}px)`;
  const threshold = stickRadius * 0.34;
  const want = new Set();
  if (dy < -threshold) want.add("KeyW");
  if (dy > threshold) want.add("KeyS");
  if (dx < -threshold) want.add("KeyA");
  if (dx > threshold) want.add("KeyD");
  for (const code of [...stickHeld]) {
    if (!want.has(code)) {
      keyUp(keysymForCode(code), code);
      stickHeld.delete(code);
    }
  }
  for (const code of want) {
    if (!stickHeld.has(code)) {
      keyDown(keysymForCode(code), code);
      stickHeld.add(code);
    }
  }
}

function stickReset() {
  stickPointer = null;
  for (const code of [...stickHeld]) {
    keyUp(keysymForCode(code), code);
    stickHeld.delete(code);
  }
  stickKnob.style.transform = "";
  stickEl.style.transform = "";
  stickEl.dataset.active = "0";
}

/* Put the ring under the thumb, kept inside the zone, and use its centre as the
 * origin so the knob starts centred and the first drag is not a jump. */
function stickStart(x, y) {
  const zone = stickZone.getBoundingClientRect();
  stickEl.style.transform = "";
  const ring = stickEl.getBoundingClientRect();
  const half = (ring.width || 148) / 2;
  const cx = Math.min(Math.max(x, zone.left + half), zone.right - half);
  const cy = Math.min(Math.max(y, zone.top + half), zone.bottom - half);
  stickEl.style.transform =
    `translate(${cx - (ring.left + half)}px, ${cy - (ring.top + half)}px)`;
  stickEl.dataset.active = "1";
  stickRadius = half * 0.86;
  return { x: cx, y: cy };
}

function gameReset() {
  stickReset();
  look = null;
  lookTravel.x = 0;
  lookTravel.y = 0;
}

stickZone.addEventListener("pointerdown", event => {
  event.preventDefault();
  if (stickPointer !== null) return;
  stickPointer = event.pointerId;
  if (stickZone.setPointerCapture) stickZone.setPointerCapture(event.pointerId);
  stickOrigin = stickStart(event.clientX, event.clientY);
  stickMove(0, 0);
});

window.addEventListener("pointermove", event => {
  if (stickPointer === null || event.pointerId !== stickPointer) return;
  event.preventDefault();
  stickMove(event.clientX - stickOrigin.x, event.clientY - stickOrigin.y);
}, { passive: false });

function stickEnd(event) {
  if (stickPointer === null || event.pointerId !== stickPointer) return;
  stickReset();
}
window.addEventListener("pointerup", stickEnd);
window.addEventListener("pointercancel", stickEnd);

for (const button of controlsEl.querySelectorAll("button[data-mouse]")) {
  const which = Number(button.dataset.mouse);
  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    if (button.setPointerCapture) button.setPointerCapture(event.pointerId);
    button.dataset.active = "1";
    pressMouse(which);
  });
  const release = () => {
    if (button.dataset.active !== "1") return;
    delete button.dataset.active;
    releaseMouse(which);
  };
  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
  button.addEventListener("lostpointercapture", release);
}

/* ---------- password prompt ---------- */
function showPasswordPrompt(message) {
  passwordMessage.textContent = message;
  passwordPrompt.hidden = false;
  passwordInput.value = "";
  passwordInput.focus();
}

passwordForm.addEventListener("submit", event => {
  event.preventDefault();
  passwordPrompt.hidden = true;
  if (rfb) rfb.sendCredentials({ password: passwordInput.value });
});

passwordCancel.addEventListener("click", () => {
  passwordPrompt.hidden = true;
  if (rfb) rfb.disconnect();
});

/* ---------- what runs where ----------
 * The container's CPU is the bottleneck and the device looking at the stream is
 * idle, so the server should compress as little as possible: decompressing and
 * scaling the picture is nearly free in the browser, while every byte x11vnc
 * compresses is CPU taken away from Minecraft.
 *
 * JPEG quality is the other half of that trade, and it is what makes a VNC stream
 * look grainy. It matters more here than in a normal session: the framebuffer is
 * 800x500 and a tablet magnifies it past 2000 device pixels, so one 8x8 JPEG block
 * covers several pixels of the screen — and the sharpening pass on top makes every
 * block edge visible. Quality 5, what Fast used to send, is where Minecraft's
 * terrain turns into noise at that size. 7 to 9 keeps the blocks under the size the
 * upscale can show; the three modes now trade zlib level instead, which is the part
 * that costs the container CPU. */
const STREAM_MODES = [
  { name: "Fast", title: "Fast stream: no zlib, least server CPU, more bandwidth", compression: 0, quality: 7 },
  { name: "Balanced", title: "Balanced stream: a little zlib, one quality step up", compression: 2, quality: 8 },
  { name: "Sharp", title: "Sharp stream: most zlib, least bandwidth, most server CPU", compression: 6, quality: 9 },
];
const STREAM_KEY = "cloudpc.streamMode";
let streamMode = 0;
try {
  const stored = Number(localStorage.getItem(STREAM_KEY));
  if (Number.isInteger(stored) && stored >= 0 && stored < STREAM_MODES.length) streamMode = stored;
} catch {
  /* storage can be blocked; the default stands */
}

function applyStreamMode(connection) {
  const setting = STREAM_MODES[streamMode];
  streamBtn.textContent = setting.name;
  streamBtn.title = setting.title;
  if (!connection) return;
  try {
    connection.compressionLevel = setting.compression;
    connection.qualityLevel = qualityFor(setting);
  } catch {
    /* an older noVNC without these properties simply keeps its defaults */
  }
}

/* A smaller framebuffer is upscaled further on the device, so the same JPEG
 * artifacts are magnified more than they are at full size — and grain is the one
 * thing the GPU stage cannot fix, because what it does is sharpen. The encoder is
 * also working on fewer pixels, so the same preset can afford a higher quality
 * there. The shipped 800x500 (400,000 pixels) gets one step as well, because a
 * tablet magnifies it just as much: 8 in Fast, 9 in Balanced and Sharp. */
function qualityFor(setting) {
  const pixels = canvas ? canvas.width * canvas.height : 0;
  if (!pixels) return setting.quality;
  if (pixels <= 200000) return Math.min(9, setting.quality + 3);
  if (pixels <= 320000) return Math.min(9, setting.quality + 2);
  if (pixels <= 420000) return Math.min(9, setting.quality + 1);
  return setting.quality;
}

/* The canvas has no size until the first framebuffer update arrives, so the quality
 * above can only be worked out once the stream is actually running. */
function reapplyStreamModeWhenSized(connection) {
  let tries = 0;
  const tick = () => {
    if (rfb !== connection) return;
    if (canvas && canvas.width && canvas.height) { applyStreamMode(connection); return; }
    if (tries++ < 240) requestAnimationFrame(tick);
  };
  tick();
}

/* Count the stream's updates, not the canvas's draw calls.
 *
 * An update is one FramebufferUpdate message, and noVNC has no event for it: the
 * events it dispatches are connect, disconnect, clipboard, desktopname and a few
 * errors. Counting the canvas's drawImage/putImageData calls instead counts one or
 * more pieces of an update, and hooking an event name that does not exist counts
 * nothing at all — which is why this read "—" forever. noVNC does call exactly one
 * method per FramebufferUpdate, so that is what is wrapped here; the canvas methods
 * are kept only as a fallback for a noVNC whose internals moved, and they are
 * collapsed per task so several rectangles still count as one update.
 *
 * An update only arrives when pixels changed: that is why a still picture reads zero,
 * and why zero was never a measurement of the game's speed. The container measures
 * the game's own frames separately (fpswatch.py, from the damage the game's window
 * receives) and reports them with the stream state. The stream rate stays as the
 * fallback and the ceiling, because a game at 30 fps whose picture arrives at 12 is a
 * 12 fps view. */
let streamFrames = 0;
let streamFps = 0;
let streamSeen = 0;
let gameFps = null;
let fpsWhy = null;
let fpsLast = 0;

function hookStreamCounter(connection) {
  if (!connection || connection.cloudpcCounted) return;
  let counted = false;
  const note = () => {
    if (counted) return;
    counted = true;
    streamFrames += 1;
    streamSeen = performance.now();
    queueMicrotask(() => { counted = false; });
  };
  const perUpdate = connection._framebufferUpdate;
  if (typeof perUpdate === "function") {
    connection.cloudpcCounted = true;
    connection._framebufferUpdate = function (...args) {
      note();
      return perUpdate.apply(this, args);
    };
    return;
  }
  const display = connection._display;
  const context = display && display._drawCtx;
  if (!context) return;
  connection.cloudpcCounted = true;
  for (const name of ["putImageData", "drawImage", "fillRect"]) {
    const original = context[name];
    if (typeof original !== "function") continue;
    context[name] = function (...args) {
      note();
      return original.apply(this, args);
    };
  }
}

/* Two numbers matter and they are not the same one: the frames the game draws, and the
 * updates the stream delivers. What reaches the device is never more than both, so the
 * smaller of the two is shown while the picture is genuinely moving. A couple of
 * updates a second is not a ceiling on the game, though — it is a still picture with a
 * water animation in it, and the game's own rate is the truthful number there. */
const STREAM_BUSY = 5;
function visibleFps() {
  const live = performance.now() - streamSeen < 1500;
  const game = Number.isFinite(gameFps) && gameFps >= 1 ? gameFps : null;
  if (game !== null) {
    if (live && streamFps >= STREAM_BUSY) return Math.min(game, streamFps);
    return game;
  }
  if (live && streamFps >= 1) return streamFps;
  return null;
}

function paintFps() {
  if (!fpsEl) return;
  const value = visibleFps();
  fpsEl.textContent = value === null
    ? (streamSeen ? "still" : "idle")
    : Math.round(value) + " fps";
  fpsEl.title = fpsWhy
    ? "The game's own frame rate is not available (" + fpsWhy + "), so this is the " +
      "stream's updates per second. A still picture sends none, which is not a slow game."
    : "The game's frames per second, capped by the updates the stream delivers while " +
      "the picture moves. A still picture sends no updates, which is not a slow game.";
}

setInterval(() => {
  const now = performance.now();
  const seconds = fpsLast ? (now - fpsLast) / 1000 : 1;
  fpsLast = now;
  const rate = streamFrames / Math.max(seconds, 0.25);
  streamFrames = 0;
  const live = now - streamSeen < 1500;
  streamFps = live ? (streamFps ? streamFps * 0.5 + rate * 0.5 : rate) : 0;
  paintFps();
  governFps();
}, 1000);

applyStreamMode(null);
streamBtn.addEventListener("click", () => {
  streamMode = (streamMode + 1) % STREAM_MODES.length;
  try { localStorage.setItem(STREAM_KEY, String(streamMode)); } catch { /* ignore */ }
  applyStreamMode(rfb);
});

/* ---------- how many pixels the container has to produce per frame ----------
 *
 * A frame costs the container pixels at every stage after the world is drawn: the
 * HUD and the upscale to the window, the copy out of llvmpipe, x11vnc reading the
 * damage, JPEGing it, and websockify shipping it. RenderScale already made the
 * world cheap by drawing it at a third of the window, but all of that still ran at
 * the full 800x500 — 400,000 pixels — however small the world was.
 *
 * So the stream is now a rectangle the container chooses. x11vnc's -clip sends that
 * sub-region as the VNC framebuffer and the game window is sized to the same
 * rectangle at 0,0, so nothing between the game and this canvas touches a pixel
 * outside it: at 50% every stage handles a quarter of the pixels, and the device
 * upscales what arrives with the GPU stage it already had.
 *
 * Auto aims that rectangle at a frame rate instead of picking one: it steps down
 * while the measured rate stays under the target and back up when there is room, so
 * the picture is as large as this container can actually keep up with.
 */
const DETAIL_KEY = "cloudpc.detail";
const DETAIL_LEVELS = [100, 80, 62, 50, 40, 30];
const DETAIL_NAMES = ["Full", "Large", "Medium", "Small", "Tiny", "Minimal"];
/* What Auto aims the picture at. Twenty was the aim when the container had one core
 * and every frame was fought for; at three it leaves frames on the table, and Auto
 * that settles for twenty looks broken next to a game that holds thirty. Auto steps
 * down under 85% of this and back up once the rate reaches it, so the band is four
 * frames wide rather than the old eleven — a machine sitting between the old two
 * thresholds could never climb out, and stayed wherever it had fallen. */
const DETAIL_TARGET = 25;
/* Auto cannot aim above the frame limit the game itself is set to. A 20 fps cap made
 * the old 28 fps climb-out unreachable, and would make a 25 fps aim unreachable too:
 * Auto would read a correctly running game as slow for ever and walk to the smallest
 * picture. The container publishes the cap it reads from the instance's options. */
let fpsCap = 0;
function detailTarget() {
  return fpsCap > 0 ? Math.min(DETAIL_TARGET, fpsCap) : DETAIL_TARGET;
}
let detailAuto = true;
let detailIndex = 1;
let detailSynced = false;
let gameRunning = false;
let detailSlow = 0;
let detailFast = 0;
let detailChanged = 0;

try {
  const saved = localStorage.getItem(DETAIL_KEY);
  if (saved === null || saved === "auto") {
    detailAuto = true;
  } else {
    const stored = Number(saved);
    if (Number.isInteger(stored) && stored >= 0 && stored < DETAIL_LEVELS.length) {
      detailIndex = stored;
      detailAuto = false;
    }
  }
} catch { /* storage can be blocked; Auto stands */ }

function paintDetail() {
  if (!detailBtn) return;
  const percent = DETAIL_LEVELS[detailIndex];
  detailBtn.textContent = detailAuto ? "Auto " + percent + "%" : DETAIL_NAMES[detailIndex];
  detailBtn.title = detailAuto
    ? "Picture detail: Auto, aiming for " + detailTarget() + " fps at " + percent +
      "% of the desktop. Tap to take it off Auto, at full size."
    : "Picture detail: " + DETAIL_NAMES[detailIndex] + ", " + percent +
      "% of the desktop." + (detailIndex < DETAIL_LEVELS.length - 1
        ? " Tap for less detail and more frames."
        : " Tap to hand the picture back to Auto.");
  detailBtn.setAttribute("aria-pressed", detailAuto ? "false" : "true");
}

function rememberDetail() {
  try {
    localStorage.setItem(DETAIL_KEY, detailAuto ? "auto" : String(detailIndex));
  } catch { /* ignore */ }
}

async function applyDetail(level, manual) {
  if (manual) detailAuto = false;
  detailIndex = Math.max(0, Math.min(DETAIL_LEVELS.length - 1, level));
  detailChanged = performance.now();
  detailSlow = 0;
  detailFast = 0;
  rememberDetail();
  paintDetail();
  const percent = DETAIL_LEVELS[detailIndex];
  try {
    const response = await fetch(controlUrl("/cloudpc/stream", { scale: percent }), {
      cache: "no-store",
    });
    if (!response.ok) return;
    const state = await response.json();
    /* With no game window the choice is only remembered for the next one. */
    gameRunning = !!state.game;
    /* Then check the stream really is that size instead of trusting the request:
     * the canvas is the one place the effect is visible. */
    setTimeout(() => {
      if (canvas && state.width && Math.abs(canvas.width - state.width) > 1) {
        console.warn("CloudPC: the stream is still " + canvas.width +
          " wide; x11vnc did not take the new region.");
      }
    }, 2500);
  } catch { /* the next poll reports where we are */ }
}

/* One control, every state: Auto, then full size, then a step down per tap, then
 * Auto again. The first tap out of Auto goes to full detail, which is the level the
 * old cycle could not reach — it started at 80% and only went down, so a player whose
 * Auto had settled on 30% had no way to ask for the picture back, and two taps later
 * was back in Auto. A tap is now a definite choice, held until the next one. */
detailBtn?.addEventListener("click", () => {
  if (detailAuto) {
    applyDetail(0, true);
    return;
  }
  if (detailIndex < DETAIL_LEVELS.length - 1) {
    applyDetail(detailIndex + 1, true);
    return;
  }
  detailAuto = true;
  rememberDetail();
  paintDetail();
  detailChanged = performance.now();
  detailSlow = 0;
  detailFast = 0;
});

/* What Auto is allowed to act on.
 *
 * The game's own rate is the honest signal and the one this prefers: it counts
 * presented frames, so a still camera reports thirty rather than zero.
 *
 * The stream rate is only a fallback, and only while the picture is actually moving.
 * That is the distinction that matters: a still picture sends no updates, which is
 * not a slow game, and shrinking the screen because nothing moved would be a guess
 * with nothing to correct it. Below a handful of updates a second the number says
 * nothing about the game, so Auto holds its setting instead. */
const GOVERN_STREAM = 8;
function governingRate() {
  if (Number.isFinite(gameFps) && gameFps >= 1) return gameFps;
  if (streamFps >= GOVERN_STREAM && performance.now() - streamSeen < 1500) {
    return streamFps;
  }
  return null;
}

function governFps() {
  const now = performance.now();
  if (!detailAuto || !gameRunning) {
    detailSlow = 0;
    detailFast = 0;
    return;
  }
  /* Let the last change settle: the game re-creates its framebuffer and the stream
   * re-sends a whole screen, and judging either while it happens is wrong. */
  if (now - detailChanged < 7000) return;
  const fps = governingRate();
  if (fps === null) {
    detailSlow = 0;
    detailFast = 0;
    return;
  }
  const target = detailTarget();
  if (fps < target * 0.85) {
    detailSlow += 1;
    detailFast = 0;
  } else if (fps >= target && streamFps >= 10) {
    /* Spend detail again only on a picture the stream can actually carry: a paused
     * or loading game draws quickly, and a stream that is only delivering a dozen
     * updates would spend the detail and hand it straight back. */
    detailFast += 1;
    detailSlow = 0;
  } else {
    detailSlow = 0;
    detailFast = 0;
  }
  if (detailSlow >= 5 && detailIndex < DETAIL_LEVELS.length - 1) {
    applyDetail(detailIndex + 1, false);
  } else if (detailFast >= 6 && detailIndex > 0) {
    applyDetail(detailIndex - 1, false);
  }
}

/* Where the container is, so Auto knows whether a low frame rate means the game is
 * slow (and the stream should shrink) or that nothing is being drawn at all — and how
 * fast the game itself is drawing, which is the number a still picture cannot give.
 * Once a second: it is a few hundred bytes next to the stream. */
async function pollStream() {
  try {
    const response = await fetch("/cloudpc/stream", { cache: "no-store" });
    if (response.ok) {
      const state = await response.json();
      gameRunning = !!state.game;
      gameFps = Number.isFinite(state.fps) ? state.fps : null;
      fpsWhy = gameFps === null ? (state.fpsWhy || null) : null;
      fpsCap = Number.isFinite(state.fpsCap) ? state.fpsCap : 0;
      if (!detailSynced) {
        detailSynced = true;
        if (detailAuto && state.scale) {
          const match = DETAIL_LEVELS.indexOf(Number(state.scale));
          if (match >= 0) { detailIndex = match; paintDetail(); }
        }
      }
    }
  } catch {
    gameRunning = false;
    gameFps = null;
    fpsWhy = "the desktop is not answering";
  }
  setTimeout(pollStream, 1000);
}

paintDetail();
pollStream();

/* ---------- the GPU stage: the device draws the last part of the frame ----------
 *
 * The container renders the desktop and x11vnc ships that framebuffer. Everything
 * after the pixels exist is scaling, and scaling is the one stage of this pipeline
 * a phone or tablet does better than the container: it has a real GPU and a battery
 * to spend, the container has a slice of a shared CPU. So the browser stops leaving
 * the final stretch to the compositor's bilinear and runs it itself, in WebGPU:
 * linear upscale to the device's own pixel grid, then a five-tap adaptive unsharp.
 *
 * The point is not only a sharper picture. It is that the picture can be made
 * smaller without looking soft, and a smaller framebuffer is the only way anything
 * on the pixel side gets cheaper for the container: 640x400 is 36% fewer pixels for
 * llvmpipe to shade and for x11vnc to read and JPEG, 512x320 is 59% fewer. That is
 * what PIXEL_OFFLOAD in entrypoint.sh selects, and this stage is the half that makes
 * it usable.
 *
 * It does not move Minecraft's rendering. The game still draws every frame on the
 * container's CPU through llvmpipe; this only takes over the last stage after those
 * pixels arrive. All-or-nothing on purpose: without WebGPU, without an adapter, or
 * after a lost device, the overlay is removed and the canvas underneath is shown
 * exactly as before.
 */
const UPSCALE_KEY = "cloudpc.gpuUpscale";
const gpu = {
  wanted: true, ready: false, failed: false, starting: false, generation: 0,
  canvas: null, context: null, device: null, pipeline: null, sampler: null,
  source: null, sourceWidth: 0, sourceHeight: 0, bindGroup: null, uniform: null,
  frame: 0, lastDraw: 0, strength: 0.42,
};
try { gpu.wanted = localStorage.getItem(UPSCALE_KEY) !== "0"; } catch { /* default on */ }

const GPU_WGSL = `
struct Params { texel: vec2f, strength: f32, pad: f32 };
@group(0) @binding(0) var samp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;
@group(0) @binding(2) var<uniform> params: Params;

struct VSOut { @builtin(position) pos: vec4f, @location(0) uv: vec2f };

@vertex
fn vs(@builtin(vertex_index) i: u32) -> VSOut {
  var corners = array<vec2f, 6>(
    vec2f(-1.0,  1.0), vec2f( 1.0,  1.0), vec2f(-1.0, -1.0),
    vec2f(-1.0, -1.0), vec2f( 1.0,  1.0), vec2f( 1.0, -1.0)
  );
  let p = corners[i];
  var result: VSOut;
  result.pos = vec4f(p, 0.0, 1.0);
  result.uv = vec2f((p.x + 1.0) * 0.5, (1.0 - p.y) * 0.5);
  return result;
}

@fragment
fn fs(frag: VSOut) -> @location(0) vec4f {
  let t = params.texel;
  let c = textureSample(tex, samp, frag.uv).rgb;
  let n = textureSample(tex, samp, frag.uv + vec2f(0.0, -t.y)).rgb;
  let s = textureSample(tex, samp, frag.uv + vec2f(0.0,  t.y)).rgb;
  let e = textureSample(tex, samp, frag.uv + vec2f( t.x, 0.0)).rgb;
  let w = textureSample(tex, samp, frag.uv + vec2f(-t.x, 0.0)).rgb;
  let mn = min(min(min(n, s), min(e, w)), c);
  let mx = max(max(max(n, s), max(e, w)), c);
  /* How much room this pixel has before it clips. Flat mid-tones get the whole
   * kernel, an edge against black or white gets almost none, which is what stops
   * the sharpening drawing a dark halo around bright text. */
  let amp = sqrt(clamp(min(mn, vec3f(1.0) - mx) / max(mx, vec3f(0.0001)), vec3f(0.0), vec3f(1.0)));
  let k = amp * (params.strength * 0.25);
  let sharp = c * (vec3f(1.0) + vec3f(4.0) * k) - k * (n + s + e + w);
  return vec4f(clamp(sharp, vec3f(0.0), vec3f(1.0)), 1.0);
}
`;

/* Three different things can leave this stage unavailable and only one of them is
 * the browser's fault, so the reason is worked out rather than assumed:
 *
 *   insecure  the page is not a secure context. WebGPU is only exposed over HTTPS
 *             (or localhost), so on http:// navigator.gpu does not exist at all, in
 *             every browser, however new it is. This is the common one: an app served
 *             on a bare port is plain HTTP.
 *   browser   a secure page, but no WebGPU: an iPad below iPadOS 26, or Chrome on
 *             iPadOS, which is a WebKit shell that is not given WebGPU.
 *   ok        navigator.gpu exists; a failure from here on is the device or the
 *             shader, and the stage falls back on its own.
 */
function gpuUnavailableReason() {
  if (typeof navigator !== "undefined" && navigator.gpu) return "ok";
  if (typeof window !== "undefined" && window.isSecureContext === false) return "insecure";
  return "browser";
}

function gpuUnavailableText(reason) {
  if (reason === "insecure") {
    return "GPU upscale needs HTTPS: this page is " + location.protocol +
      "//, and browsers hide WebGPU on insecure origins. Open CloudPC over https://.";
  }
  return "This browser has no WebGPU. On an iPad that means Safari on iPadOS 26 or newer.";
}

let explainTimer = 0;
function explainGpuUnavailable(reason) {
  const message = gpuUnavailableText(reason);
  const previous = statusEl.textContent;
  statusEl.textContent = message;
  console.warn("CloudPC: " + message);
  clearTimeout(explainTimer);
  explainTimer = setTimeout(() => {
    if (statusEl.textContent === message) statusEl.textContent = previous;
  }, 9000);
}

function paintUpscaleButton() {
  if (!upscaleBtn) return;
  const reason = gpuUnavailableReason();
  const supported = reason === "ok";
  /* Never disabled: tapping it is how the reason is shown, because a phone has no
   * tooltip to read a title from. */
  upscaleBtn.setAttribute("aria-pressed", String(supported && gpu.wanted && gpu.ready));
  upscaleBtn.textContent = !supported ? "GPU ✕" : gpu.ready ? "GPU" : "GPU off";
  upscaleBtn.title = !supported
    ? gpuUnavailableText(reason)
    : gpu.ready
      ? "GPU upscale on: the device scales and sharpens the stream (tap to turn off)"
      : "GPU upscale off: the browser's own scaling draws the stream (tap to turn on)";
}

/* Contain-fit the framebuffer against the stage, computed here rather than copied
 * from noVNC's canvas rect. Mirroring that rect looked equivalent and is not: any
 * disagreement between where noVNC thinks its canvas is and where the stream
 * actually is turns into a crop of the desktop instead of the whole picture. This
 * way the device always sees all of the framebuffer, centred, with black bars —
 * object-fit: contain, done in the shader's viewport. */
function sizeGpuCanvas() {
  const element = gpu.canvas;
  if (!element || !canvas) return;
  const sourceWidth = canvas.width;
  const sourceHeight = canvas.height;
  if (!sourceWidth || !sourceHeight) return;
  const host = screenEl.getBoundingClientRect();
  if (!host.width || !host.height) return;
  const fit = Math.min(host.width / sourceWidth, host.height / sourceHeight);
  const boxWidth = Math.max(1, Math.round(sourceWidth * fit));
  const boxHeight = Math.max(1, Math.round(sourceHeight * fit));
  const style = element.style;
  const left = Math.round((host.width - boxWidth) / 2) + "px";
  const top = Math.round((host.height - boxHeight) / 2) + "px";
  const width = boxWidth + "px";
  const height = boxHeight + "px";
  if (style.left !== left) style.left = left;
  if (style.top !== top) style.top = top;
  if (style.width !== width) style.width = width;
  if (style.height !== height) style.height = height;
  /* Render at device pixels, capped so a huge tablet canvas cannot ask for a
   * texture the adapter will refuse. */
  const scale = Math.min(window.devicePixelRatio || 1, 3);
  const deviceWidth = Math.max(1, Math.min(Math.round(boxWidth * scale), 4096));
  const deviceHeight = Math.max(1, Math.min(Math.round(boxHeight * scale), 4096));
  if (element.width !== deviceWidth) element.width = deviceWidth;
  if (element.height !== deviceHeight) element.height = deviceHeight;
}

function resizeGpuSource(width, height) {
  if (gpu.source) { try { gpu.source.destroy(); } catch { /* already gone */ } }
  gpu.sourceWidth = width;
  gpu.sourceHeight = height;
  gpu.source = gpu.device.createTexture({
    size: [width, height],
    format: "rgba8unorm",
    usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT,
  });
  gpu.bindGroup = gpu.device.createBindGroup({
    layout: gpu.pipeline.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: gpu.sampler },
      { binding: 1, resource: gpu.source.createView() },
      { binding: 2, resource: { buffer: gpu.uniform } },
    ],
  });
  gpu.device.queue.writeBuffer(gpu.uniform, 0,
    new Float32Array([1 / width, 1 / height, gpu.strength, 0]));
}

function drawGpuFrame() {
  if (!gpu.ready || !canvas || !canvas.isConnected) return;
  const width = canvas.width;
  const height = canvas.height;
  if (!width || !height) return;
  try {
    if (gpu.sourceWidth !== width || gpu.sourceHeight !== height) resizeGpuSource(width, height);
    if (!gpu.bindGroup) return;
    sizeGpuCanvas();
    if (!gpu.canvas.width || !gpu.canvas.height) return;
    gpu.device.queue.copyExternalImageToTexture({ source: canvas }, { texture: gpu.source }, { width, height });
    const encoder = gpu.device.createCommandEncoder();
    const pass = encoder.beginRenderPass({
      colorAttachments: [{
        view: gpu.context.getCurrentTexture().createView(),
        clearValue: { r: 0, g: 0, b: 0, a: 1 },
        loadOp: "clear", storeOp: "store",
      }],
    });
    pass.setPipeline(gpu.pipeline);
    pass.setBindGroup(0, gpu.bindGroup);
    pass.draw(6);
    pass.end();
    gpu.device.queue.submit([encoder.finish()]);
  } catch (error) {
    console.warn("CloudPC: GPU stage stopped, falling back to browser scaling:", error && error.message ? error.message : error);
    stopGpuStage();
    gpu.failed = true;
  }
}

function startGpuLoop() {
  if (gpu.frame) return;
  const step = now => {
    gpu.frame = requestAnimationFrame(step);
    if (!gpu.ready || document.hidden) return;
    /* The stream arrives at about 20 updates a second; drawing 30 times a second
     * keeps up with it without copying a canvas nobody changed at 120 Hz. */
    if (now - gpu.lastDraw < 33) return;
    gpu.lastDraw = now;
    drawGpuFrame();
  };
  gpu.frame = requestAnimationFrame(step);
}

function stopGpuStage() {
  gpu.generation += 1;
  if (gpu.frame) { cancelAnimationFrame(gpu.frame); gpu.frame = 0; }
  if (gpu.canvas && gpu.canvas.parentNode) gpu.canvas.parentNode.removeChild(gpu.canvas);
  if (gpu.source) { try { gpu.source.destroy(); } catch { /* already gone */ } }
  if (gpu.device) { try { gpu.device.destroy(); } catch { /* already gone */ } }
  gpu.ready = false;
  gpu.starting = false;
  gpu.canvas = null;
  gpu.context = null;
  gpu.device = null;
  gpu.pipeline = null;
  gpu.sampler = null;
  gpu.source = null;
  gpu.bindGroup = null;
  gpu.uniform = null;
  gpu.sourceWidth = 0;
  gpu.sourceHeight = 0;
  paintUpscaleButton();
}

async function startGpuStage() {
  if (!gpu.wanted || gpu.ready || gpu.starting || !navigator.gpu) { paintUpscaleButton(); return; }
  gpu.starting = true;
  const generation = gpu.generation;
  try {
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: "low-power" });
    if (generation !== gpu.generation || !gpu.wanted) return;
    if (!adapter) throw new Error("no WebGPU adapter");
    const device = await adapter.requestDevice();
    if (generation !== gpu.generation || !gpu.wanted) { device.destroy(); return; }

    const element = document.createElement("canvas");
    element.className = "gpuStage";
    element.setAttribute("aria-hidden", "true");
    const context = element.getContext("webgpu");
    if (!context) throw new Error("no webgpu context");
    const format = navigator.gpu.getPreferredCanvasFormat();
    context.configure({ device, format, alphaMode: "opaque" });

    const module = device.createShaderModule({ code: GPU_WGSL });
    /* Async on purpose: a WGSL or pipeline error rejects here, inside the try, so
     * the stage falls back to the browser's scaling. createRenderPipeline() would
     * only raise an uncaptured device error and leave a black canvas behind. */
    const pipeline = await device.createRenderPipelineAsync({
      layout: "auto",
      vertex: { module, entryPoint: "vs" },
      fragment: { module, entryPoint: "fs", targets: [{ format }] },
      primitive: { topology: "triangle-list" },
    });
    const sampler = device.createSampler({
      magFilter: "linear", minFilter: "linear",
      addressModeU: "clamp-to-edge", addressModeV: "clamp-to-edge",
    });
    const uniform = device.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });

    gpu.device = device;
    gpu.canvas = element;
    gpu.context = context;
    gpu.pipeline = pipeline;
    gpu.sampler = sampler;
    gpu.uniform = uniform;
    gpu.source = null;
    gpu.sourceWidth = 0;
    gpu.sourceHeight = 0;
    gpu.ready = true;
    screenEl.appendChild(element);

    device.lost.then(info => {
      if (info.reason === "destroyed") return;
      console.warn("CloudPC: WebGPU device lost, falling back to browser scaling:", info.message);
      stopGpuStage();
      gpu.failed = true;
    });

    startGpuLoop();
  } catch (error) {
    if (generation !== gpu.generation) return;
    console.warn("CloudPC: GPU upscale unavailable, using browser scaling:", error && error.message ? error.message : error);
    stopGpuStage();
    gpu.failed = true;
  } finally {
    gpu.starting = false;
    paintUpscaleButton();
  }
}

/* The stage lives inside #screen, which connect() empties on every reconnect, so
 * this is called whenever a canvas is adopted rather than only once. */
function ensureGpuStage() {
  if (!gpu.wanted) return;
  if (gpu.ready) {
    if (gpu.canvas && gpu.canvas.parentNode !== screenEl) screenEl.appendChild(gpu.canvas);
    return;
  }
  startGpuStage();
}

upscaleBtn.addEventListener("click", () => {
  const reason = gpuUnavailableReason();
  if (reason !== "ok") { explainGpuUnavailable(reason); return; }
  const turningOff = gpu.wanted && gpu.ready && !gpu.failed;
  gpu.wanted = !turningOff;
  try { localStorage.setItem(UPSCALE_KEY, gpu.wanted ? "1" : "0"); } catch { /* ignore */ }
  if (gpu.wanted) {
    gpu.failed = false;
    startGpuStage();
  } else {
    stopGpuStage();
  }
  paintUpscaleButton();
});

paintUpscaleButton();
if (gpuUnavailableReason() !== "ok") {
  console.warn("CloudPC: " + gpuUnavailableText(gpuUnavailableReason()));
}

/* ---------- connection ---------- */
function adoptCanvas(connection) {
  const element = connection._canvas || screenEl.querySelector("canvas:not(.gpuStage)");
  if (!element || element === canvas) return;
  canvas = element;
  /* keep the virtual cursor in sync when the canvas is used directly */
  element.addEventListener("mousemove", event => {
    cursor = { x: event.clientX, y: event.clientY };
  }, true);
  hookStreamCounter(connection);
  reapplyStreamModeWhenSized(connection);
  ensureGpuStage();
}

function connect() {
  trackReset();
  if (rfb) {
    try { rfb.disconnect(); } catch { /* already gone */ }
    rfb = null;
  }
  canvas = null;
  cursor = null;
  streamFrames = 0;
  streamFps = 0;
  streamSeen = 0;
  fpsLast = 0;
  passwordPrompt.hidden = true;
  screenEl.replaceChildren();
  reconnectBtn.style.display = "none";
  statusEl.textContent = "Connecting to desktop…";

  try {
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    const connection = new RFB(screenEl, scheme + "://" + location.host + "/websockify");
    rfb = connection;
    adoptCanvas(connection);

    connection.scaleViewport = true;
    connection.resizeSession = false;
    connection.showDotCursor = true;
    connection.viewOnly = false;
    connection.dragViewport = false;

    /* The stream can change size mid-session (x11vnc re-clips to the game window),
     * and the quality preset is chosen from that size, so it is re-applied here. */
    connection.addEventListener("desktopsize", () => {
      adoptCanvas(connection);
      reapplyStreamModeWhenSized(connection);
    });

    connection.addEventListener("connect", () => {
      adoptCanvas(connection);
      applyStreamMode(connection);
      syncLock();
      statusEl.textContent = "Connected";
      reconnectBtn.style.display = "none";
    });

    connection.addEventListener("credentialsrequired", () => {
      if (rfb !== connection) return;
      statusEl.textContent = "Password required";
      showPasswordPrompt("Enter the VNC password for this desktop.");
    });

    connection.addEventListener("disconnect", event => {
      if (rfb !== connection) return;
      rfb = null;
      canvas = null;
      trackReset();
      statusEl.textContent = event.detail?.clean ? "Disconnected" : "Connection lost";
      reconnectBtn.style.display = "inline-flex";
    });

    connection.addEventListener("securityfailure", event => {
      if (rfb !== connection) return;
      rfb = null;
      canvas = null;
      statusEl.textContent = "Connection rejected";
      showPasswordPrompt("The desktop rejected the connection: " +
        (event.detail?.reason || "security negotiation failed") + ". Try again.");
    });
  } catch (error) {
    rfb = null;
    canvas = null;
    statusEl.textContent = "Could not connect: " + (error?.message || "unknown error");
    reconnectBtn.style.display = "inline-flex";
  }
}

reconnectBtn.addEventListener("click", connect);
connect();
</script>
</body>
</html>
