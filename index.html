<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<title>CloudPC</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d16;color:#f8fafc}
#toolbar{height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#111c2d;color:#dbeafe;font-size:14px}
#status{color:#bdc9da}#screen{height:calc(100% - 48px);width:100%;display:flex;align-items:center;justify-content:center;overflow:auto}
#screen canvas{max-width:100%;max-height:100%}
button{padding:7px 12px;border:0;border-radius:8px;background:#78a9ff;color:#081326;font:inherit;font-weight:750;cursor:pointer}
#reconnect{display:none}
</style>
</head>
<body>
<div id="toolbar"><strong>CloudPC</strong><span id="status">Connecting to desktop…</span><button id="reconnect" type="button">Reconnect</button></div>
<div id="screen"></div>
<script type="module">
import RFB from "/core/rfb.js";
const screen=document.querySelector("#screen");
const status=document.querySelector("#status");
const reconnect=document.querySelector("#reconnect");
let rfb=null;
function connect(){
  if(rfb){try{rfb.disconnect()}catch{};rfb=null;}
  screen.replaceChildren();
  reconnect.style.display="none";
  status.textContent="Connecting to desktop…";
  try{
    const scheme=location.protocol==="https:"?"wss":"ws";
    const connection=new RFB(screen,scheme+"://"+location.host+"/websockify");
    rfb=connection;
    connection.scaleViewport=true;
    connection.resizeSession=false;
    connection.showDotCursor=true;
    connection.addEventListener("connect",()=>{status.textContent="Connected";});
    connection.addEventListener("disconnect",event=>{
      if(rfb!==connection)return;
      rfb=null;
      status.textContent=event.detail?.clean?"Disconnected":"Connection lost";
      reconnect.style.display="inline-block";
    });
    connection.addEventListener("securityfailure",event=>{
      if(rfb!==connection)return;
      rfb=null;
      status.textContent="Connection rejected: "+(event.detail?.reason||"security negotiation failed");
      reconnect.style.display="inline-block";
    });
  }catch(error){
    rfb=null;
    status.textContent="Could not connect: "+(error?.message||"unknown error");
    reconnect.style.display="inline-block";
  }
}
reconnect.addEventListener("click",connect);
connect();
</script>
</body>
</html>
