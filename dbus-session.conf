<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>

  <!--
    The session bus listens on loopback TCP instead of a unix socket on purpose.

    GDBus (GLib) sends SCM_CREDENTIALS as the very first thing on any unix
    connection, before authentication, via g_unix_connection_send_credentials().
    Sandboxed container runtimes reject that sendmsg() with EPERM, which surfaces
    in XFCE as "Unable to contact settings server / Error sending credentials:
    Error sending message: Operation not permitted" because xfconfd and
    xfsettingsd can never connect to the bus.

    On a TCP connection GDBus writes a plain NUL byte and never sends
    credentials, so the same clients connect fine. The address is bound to
    127.0.0.1 inside this container only.
  -->
  <listen>tcp:host=127.0.0.1,port=0</listen>

  <!-- ANONYMOUS is required over TCP (there are no peer credentials to verify);
       DBUS_COOKIE_SHA1 is kept as a fallback for clients that prefer it. -->
  <auth>ANONYMOUS</auth>
  <auth>DBUS_COOKIE_SHA1</auth>
  <allow_anonymous/>

  <!-- Lets dbus-daemon autostart session services such as org.xfce.Xfconf. -->
  <standard_session_servicedirs/>

  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
